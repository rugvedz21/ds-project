# ---------------------------------------------------------------------------
# Mosquitto configuration -- optional drop-in replacement for the embedded
# broker.
#
# The server starts an embedded MQTT broker (Aedes) by default so the project
# runs with nothing to install. Aedes speaks the same MQTT 3.1.1 protocol on
# the same ports, so nothing in the client code changes either way.
#
# Use this file if you would rather demonstrate against a standard external
# broker:
#
#   1. install Mosquitto (https://mosquitto.org/download/)
#   2. mosquitto -c mosquitto/mosquitto.conf -v
#   3. start the server with the embedded broker disabled:
#        set EMBEDDED_BROKER=0 && npm start          (cmd)
#        $env:EMBEDDED_BROKER=0; npm start           (PowerShell)
#
# Ports must match the ones the server expects.
# ---------------------------------------------------------------------------

# --- Plain MQTT over TCP ---------------------------------------------------
# Used by the session server itself, and by any native (non-browser) peer.
listener 1883
protocol mqtt

# --- MQTT over WebSockets --------------------------------------------------
# Browsers cannot open raw TCP sockets, so a browser peer MUST use this
# listener. Mosquitto does not enable it by default -- forgetting this is the
# single most common reason a browser MQTT client fails to connect.
listener 9001
protocol websockets

# --- Access ----------------------------------------------------------------
# Open access, appropriate for a LAN demo on a trusted network only. A
# deployment would use per-peer credentials and an ACL restricting each peer
# to its own session/{id}/# subtree -- otherwise any client could publish a
# tempo change or forge WebRTC signalling into somebody else's session.
allow_anonymous true

# --- Persistence -----------------------------------------------------------
# Retained messages are what let a node that joins late (or reconnects after a
# crash) learn the current tempo, roster, transport state and timing master
# the instant it subscribes, instead of waiting for the next change. Keeping
# them on disk means that also survives a broker restart.
persistence true
persistence_location mosquitto/data/
autosave_interval 30

# --- Limits ----------------------------------------------------------------
# Control messages are small; this bounds the damage from a malformed client.
message_size_limit 65536
max_queued_messages 1000

# --- Logging ---------------------------------------------------------------
# Useful during the demo: shows subscriptions and retained-message delivery
# live, which makes the pub/sub decoupling visible rather than theoretical.
log_type notice
log_type information
connection_messages true
log_timestamp true
